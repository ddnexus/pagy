name: Publish Docs
on:
  workflow_dispatch:
  push:
    branches:
      - 'master' # run only for master
    paths:
      - '.github/workflows/publish-docs.yml'
      - 'assets/**'
      - 'docs/**'
      - 'gem/config/pagy.rb'
      - 'gem/locales/en.yml'
      - 'gem/stylesheets/**'
      - 'README.md'

jobs:
  publish:
    name: Publish to docs-site branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: retypeapp/action-build@latest
        env:
          RETYPE_KEY: ${{ secrets.RETYPE_KEY }}
        with:
          config_path: docs/
          override: '{"url": "https://${{github.repository_owner}}.github.io/pagy/"}'

      - uses: retypeapp/action-github-pages@latest
        with:
          branch: docsite
          update-branch: true
