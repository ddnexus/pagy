name: E2E Test

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
    paths: &paths
      - '.github/workflows/e2e-test.yml'
      - 'Gemfile.lock'
      - 'bun.lock'
      - 'gem/**'
      - '!gem/config/**'
      - '!gem/locales/**'
      - 'gem/locales/en.yml'
      - 'tasks/**'
      - 'test/e2e/**'
      - 'test/test_helper.rb'
      - '!**/*.md'
  pull_request:
    branches: [ '**' ]
    paths: *paths

jobs:
  e2e_test:
    name: E2E Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: latest
      - name: Set up ruby
        uses: ruby/setup-ruby@v1.334.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Test E2E apps
        run: bundle exec thor test:e2e:apps
