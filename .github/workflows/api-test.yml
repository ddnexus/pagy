name: API Test

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
    paths: &paths
      - '.github/workflows/api-test.yml'
      - '.rubocop.yml'
      - 'Gemfile.lock'
      - 'gem/**'
      - '!gem/config/**'
      - '!gem/locales/**'
      - 'gem/locales/en.yml'
      - 'tasks/**'
      - 'test/**'
      - '!test/e2e/**'
      - '!**/*.md'
  pull_request:
    branches: [ '**' ]
    paths: *paths

jobs:
  api_test:
    name: API ${{ matrix.ruby-version }} Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: [ '3.3', '3.4', '4.0' ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Set up ruby
        uses: ruby/setup-ruby@v1.329.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Test Rubocop compliance
        run: bundle exec rubocop --format github
      - name: Test current and next API
        run: bundle exec thor test:api:all
      - name: Test API Coverage
        if: matrix.ruby-version == '4.0'
        run: bundle exec thor test:api:coverage # fail for coverage < 100%
